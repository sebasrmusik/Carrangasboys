<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Carrangas Boys · Links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Bungee&display=swap">
<style>
:root{--black:#000;--azul:#69B8D5;--marino:#8ACCDC;--arcilla:#E57A3E;--terra:#D8592F;--white:#fff;
  --display:"Bungee","Arial Black",Impact,sans-serif;--body:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--body);font-weight:500;font-size:1.2rem;line-height:1.3;min-height:100vh}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--marino);outline-offset:4px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.page{position:relative;z-index:1;max-width:28rem;margin:0 auto;padding:2.5rem 1.25rem 2rem;display:flex;flex-direction:column;gap:2rem}
.logo{display:block;width:min(80vw,21rem);height:auto;margin:0 auto}
.tag{margin:1rem auto 0;text-align:center;color:var(--marino);font-size:1.3rem;max-width:none}

.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8rem}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:3.75rem;padding:.8rem 1rem;
  border:2px solid var(--azul);border-radius:16px;background:rgba(0,0,0,.72);text-align:center;transition:transform .12s,border-color .12s,background .12s}
.t{font:400 1.05rem/1.2 var(--display);letter-spacing:.01em}
.s{font-size:1.05rem;color:var(--marino)}
.btn.main{background:var(--terra);border-color:var(--white)}
.btn.main .s{color:var(--white)}
.btn.hire{background:var(--arcilla);border-color:var(--white);color:var(--black)}
.btn.hire .s{color:var(--black)}
.btn.soon{border-style:dashed;border-color:rgba(138,204,220,.55);color:var(--marino);cursor:default}
.btn:not(.soon):active{transform:scale(.98)}
@media (hover:hover){.btn:not(.soon):hover{transform:translateY(-2px);border-color:var(--arcilla)}.btn.main:hover,.btn.hire:hover{border-color:var(--marino)}}

.foot{display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--azul);font-size:1.05rem}
.mail{color:var(--marino);font-size:1.25rem;border-bottom:2px solid var(--arcilla);padding-bottom:.1rem;overflow-wrap:anywhere}
.mark{width:3rem;aspect-ratio:1;background:var(--marino);-webkit-mask:var(--emb) center/contain no-repeat;mask:var(--emb) center/contain no-repeat}

/* Escritorio */
@media (min-width:900px){
  .page{max-width:none;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:1fr auto;
    column-gap:6vw;padding:4rem 7vw 2rem;align-items:center}
  .id{grid-row:1}
  .logo{width:min(36vw,36rem);margin:0}
  .tag{text-align:left;margin:2rem 0 0;font-size:1.6rem;max-width:none}
  .links{grid-row:1;gap:0;border-top:2px solid rgba(105,184,213,.6)}
  .btn{flex-direction:row;justify-content:space-between;align-items:center;gap:2rem;min-height:5.5rem;padding:1.2rem 1.25rem;
    border:0;border-bottom:2px solid rgba(105,184,213,.6);border-radius:0;background:transparent;text-align:left}
  .t{font-size:clamp(1.4rem,2.4vw,2.2rem)}
  .s{font-size:1.25rem;text-align:right}
  .btn.main{background:var(--terra)}
  .btn.hire{background:var(--arcilla)}
  .btn.soon{border-style:solid;border-bottom-color:rgba(105,184,213,.6);opacity:.7}
  @media (hover:hover){.btn:not(.soon):hover{transform:none;background:var(--azul);color:var(--black)}.btn:not(.soon):hover .s{color:var(--black)}}
  .foot{grid-column:1/-1;margin-top:3rem;text-align:center}
}
@media (max-width:899px){.id{text-align:center}}
</style>
</head>
